# Playwright — MANUAL DISPATCH ONLY (Phase 29.D11)
#
# ⚠️ THIS IS NOT IN THE PUSH CI, AND THAT IS A DECISION RATHER THAN AN OMISSION. The suite has never
# been run green in full at its pinned configuration. A suite that makes every commit red teaches the
# reader to ignore the badge, which is the one outcome that makes CI worthless.
#
# ⚠️ `retries` STAYS 0. A retried flake reads exactly like a pass, and a skipped mutation reads exactly
# like a caught one — so a suite that retries cannot tell you which it did.
#
# Move this into ci.yml only after a full green run at this configuration, and say when that happened.

#
# ⚠️⚠️ ACTION MAJORS BUMPED 2026-11-02, AND THE REASON WAS AN ANNOTATION RATHER THAN A FAILURE. Every run
# carried "Node.js 20 is deprecated... being forced to run on Node.js 24" because `checkout@v4` and
# `setup-node@v4` declare `using: node20`. The current majors declare node24, so the warning goes away by
# moving forward rather than by silencing anything.
#
# ⚠️ ONLY STABLE INPUTS ARE PASSED HERE -- `node-version`, `cache`, `cache-dependency-path`, `path`,
# `files`, `retention-days` -- which is why a major bump is a drop-in for THIS workflow and would not be
# for one using removed inputs. ⚠️ THE PAGES TRIO MOVES TOGETHER (`configure-pages`,
# `upload-pages-artifact`, `deploy-pages`): the matching majors are the supported combination.
#
# ⚠️⚠️ A BUMP IS NOT DONE UNTIL IT HAS RUN, which is this file's own standing rule. `ci` and `pages` fire
# on push; `release` needs a `workflow_dispatch` rehearsal, where the upload step is gated on
# `refs/tags/` and therefore skipped. Prove it with a run; do not reason about it.

name: browser-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psss-engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: psss-engine/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # The engine needs WebGL2. A headless software rasteriser is enough for the DOM-reaching specs;
      # anything that asserts on PIXELS should be read as a claim about the rasteriser until proven
      # otherwise.
      - run: npm run verify:browser

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: psss-engine/.playwright
          retention-days: 7
