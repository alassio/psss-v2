# CI — the consistency gate (Phase 29.6)
#
# `npm run verify` is `tsc --noEmit` plus every static checker in psss-engine/checks/. All of them are
# pure Node: no browser, no .NET, no GPU. That is why this workflow is cheap and is the one that runs
# on every push.
#
# ⚠️ NODE 22 IS PINNED AND IT IS NOT A PREFERENCE. reelcheck imports reel-model.ts directly under
# Node's type stripping. Node 20 has none, so check:reel dies with ERR_UNKNOWN_FILE_EXTENSION — green
# locally, red here, for a reason the log misattributes to the checker.
#
# ⚠️ verify:browser IS DELIBERATELY ABSENT. See browser-tests.yml.

#
# ⚠️⚠️ ACTION MAJORS BUMPED 2026-11-02, AND THE REASON WAS AN ANNOTATION RATHER THAN A FAILURE. Every run
# carried "Node.js 20 is deprecated... being forced to run on Node.js 24" because `checkout@v4` and
# `setup-node@v4` declare `using: node20`. The current majors declare node24, so the warning goes away by
# moving forward rather than by silencing anything.
#
# ⚠️ ONLY STABLE INPUTS ARE PASSED HERE -- `node-version`, `cache`, `cache-dependency-path`, `path`,
# `files`, `retention-days` -- which is why a major bump is a drop-in for THIS workflow and would not be
# for one using removed inputs. ⚠️ THE PAGES TRIO MOVES TOGETHER (`configure-pages`,
# `upload-pages-artifact`, `deploy-pages`): the matching majors are the supported combination.
#
# ⚠️⚠️ A BUMP IS NOT DONE UNTIL IT HAS RUN, which is this file's own standing rule. `ci` and `pages` fire
# on push; `release` needs a `workflow_dispatch` rehearsal, where the upload step is gated on
# `refs/tags/` and therefore skipped. Prove it with a run; do not reason about it.

name: verify

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: psss-engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: psss-engine/package-lock.json

      # ⚠️ The Playwright browser download is skipped here on purpose: nothing in `verify` needs a
      # browser, and downloading one would triple the run for no assertion.
      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Delete any stray temporary checkers
        run: rm -f checks/_tmp_*

      - name: verify  (tsc --noEmit + every checker in checks/)
        run: npm run verify

      - name: check:specs  (tsc over the Playwright specs)
        # ⚠️ Invisible to `verify` because tsconfig.json is "include": ["src"]. It is a separate gate.
        run: npm run check:specs

      - name: build  (proves the deployment still builds)
        run: npm run build
