# Pages — publish the browser demo (Phase 29.7)
#
# ⚠️ DO NOT ADD A VITE `base` OVERRIDE. vite.config.ts sets `base: './'`, which already satisfies BOTH
# a Pages subpath and the `file://` route, and that file's header documents why. Setting
# `base: '/psss-v2/'` would break `file://` and the screensaver payload — and it would do it as a blank
# page with a clean console.
#
# ⚠️ A PAGES URL IS A FOURTH ROUTE, beside the dev server, `vite preview` and `file://`. A confirmation
# on one of the others is not evidence about this one.

#
# ⚠️⚠️ ACTION MAJORS BUMPED 2026-11-02, AND THE REASON WAS AN ANNOTATION RATHER THAN A FAILURE. Every run
# carried "Node.js 20 is deprecated... being forced to run on Node.js 24" because `checkout@v4` and
# `setup-node@v4` declare `using: node20`. The current majors declare node24, so the warning goes away by
# moving forward rather than by silencing anything.
#
# ⚠️ ONLY STABLE INPUTS ARE PASSED HERE -- `node-version`, `cache`, `cache-dependency-path`, `path`,
# `files`, `retention-days` -- which is why a major bump is a drop-in for THIS workflow and would not be
# for one using removed inputs. ⚠️ THE PAGES TRIO MOVES TOGETHER (`configure-pages`,
# `upload-pages-artifact`, `deploy-pages`): the matching majors are the supported combination.
#
# ⚠️⚠️ A BUMP IS NOT DONE UNTIL IT HAS RUN, which is this file's own standing rule. `ci` and `pages` fire
# on push; `release` needs a `workflow_dispatch` rehearsal, where the upload step is gated on
# `refs/tags/` and therefore skipped. Prove it with a run; do not reason about it.

name: pages

on:
  push:
    branches: [main]
    paths:
      - 'psss-engine/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: psss-engine/package-lock.json

      - run: npm ci
        working-directory: psss-engine
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - run: npm run build
        working-directory: psss-engine

      # The deployment is FOUR files and two of them are JS by content, not JSON. The preset file is
      # FATAL if missing; the reel file is OPTIONAL — absent means a warning and the bundled built-in
      # reels play. Never make them symmetric.
      - name: Assert the deployment's four files
        working-directory: psss-engine
        run: |
          set -e
          test -f dist/index.html        || { echo "FAIL dist/index.html";       exit 1; }
          test -f dist/psss_presets.json || { echo "FAIL dist/psss_presets.json"; exit 1; }
          ls dist/*.js >/dev/null        || { echo "FAIL no bundle in dist/";    exit 1; }
          if [ -f dist/psss_reels.json ]; then echo "ok  psss_reels.json present";
          else echo "note psss_reels.json absent — built-in reels will play"; fi
          grep -q 'g_psss_presets' dist/psss_presets.json \
            || { echo "FAIL psss_presets.json is not the deployment assignment format"; exit 1; }

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: psss-engine/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
